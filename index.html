<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alo Rico - Panel Operador</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 font-family:'Poppins',sans-serif;
 background:#0f172a;
 color:white;
 overflow-x:hidden;
}

body::before{
 content:"";
 position:fixed;
 inset:0;

 background:
 linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.90)),
 url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1600&auto=format&fit=crop');

 background-size:cover;
 background-position:center;

 z-index:-2;
}

body::after{
 content:"";
 position:fixed;
 inset:0;
 backdrop-filter:blur(8px);
 z-index:-1;
}

.card{

 background:rgba(255,255,255,.06);

 border:1px solid rgba(255,255,255,.08);

 backdrop-filter:blur(12px);

 border-radius:28px;

 box-shadow:0 10px 35px rgba(0,0,0,.35);

}

.pedido-card{

 background:#1e293b;

 border-radius:20px;

 padding:14px;

 border:1px solid rgba(255,255,255,.08);

 box-shadow:0 10px 30px rgba(0,0,0,.35);

 transition:.25s;

 animation:fadeIn .3s ease;

}

@keyframes fadeIn{

 from{
  opacity:0;
  transform:translateY(20px);
 }

 to{
  opacity:1;
  transform:translateY(0);
 }

}

.btn{

 border:none;

 border-radius:18px;

 padding:12px;

 font-weight:700;

 cursor:pointer;

 transition:.25s;

 color:white;

}

.scroll-area{

 max-height:calc(100vh - 160px);

 overflow-y:auto;

 overflow-x:hidden;

 padding-right:4px;

}

.estado-pendiente{
 background:#eab308;
 color:black;
}

.estado-preparando{
 background:#3b82f6;
}

.estado-listo{
 background:#22c55e;
}

.estado-entregado{
 background:#64748b;
}

.estado-cancelado{
 background:#ef4444;
}

@media(max-height:800px){

 h1{
  font-size:38px !important;
 }

 h2{
  font-size:24px !important;
 }

 .pedido-card{
  padding:12px;
 }

 .pedido-card h3{
  font-size:22px !important;
 }

 .pedido-card p{
  font-size:13px !important;
 }

 .btn{
  padding:10px;
  font-size:13px;
 }

 .scroll-area{
  max-height:calc(100vh - 130px);
 }

 .card{
  padding:14px !important;
 }

}

.scroll-area::-webkit-scrollbar{
 width:8px;
}

.scroll-area::-webkit-scrollbar-thumb{
 background:#334155;
 border-radius:10px;
}

.scroll-area::-webkit-scrollbar-track{
 background:transparent;
}

</style>

</head>

<body>

<div class="p-4">

<div class="flex flex-col xl:flex-row justify-between gap-4 mb-6">

 <div>

  <h1 class="text-5xl font-bold text-yellow-400">
   Alo Rico Panel
  </h1>

  <p class="text-gray-300 mt-1 text-lg">
   Operador • Cocina • Delivery
  </p>

 </div>

 <div class="grid grid-cols-2 md:grid-cols-3 gap-4">

  <div class="card p-4 min-w-[150px]">

   <p class="text-gray-400 text-sm">
    Ventas Hoy
   </p>

   <h2 id="ventas-hoy"
   class="text-2xl font-bold text-green-400 mt-2">
    Gs. 0
   </h2>

  </div>

  <div class="card p-4 min-w-[150px]">

   <p class="text-gray-400 text-sm">
    Pedidos Activos
   </p>

   <h2 id="cantidad-pedidos"
   class="text-2xl font-bold text-blue-400 mt-2">
    0
   </h2>

  </div>

  <div class="card p-4 min-w-[150px]">

   <p class="text-gray-400 text-sm">
    Deliverys
   </p>

   <h2 id="cantidad-delivery"
   class="text-2xl font-bold text-orange-400 mt-2">
    0
   </h2>

  </div>

 </div>

</div>

<div class="grid grid-cols-1 xl:grid-cols-4 gap-4">

 <div class="card p-4">

  <h2 class="text-3xl font-bold text-yellow-400 mb-4">
   Pendientes
  </h2>

  <div id="contenedor-pendientes"
  class="scroll-area space-y-4"></div>

 </div>

 <div class="card p-4">

  <h2 class="text-3xl font-bold text-blue-400 mb-4">
   En Preparación
  </h2>

  <div id="contenedor-cocina"
  class="scroll-area space-y-4"></div>

 </div>

 <div class="card p-4">

  <h2 class="text-3xl font-bold text-green-400 mb-4">
   Listos
  </h2>

  <div id="contenedor-listos"
  class="scroll-area space-y-4"></div>

 </div>

 <div class="card p-4">

  <h2 class="text-3xl font-bold text-gray-300 mb-4">
   Historial Delivery
  </h2>

  <div id="historial-delivery"></div>

  <div id="contenedor-historial"
  class="scroll-area space-y-4 mt-4"></div>

 </div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
 getDatabase,
 ref,
 onValue,
 update
}
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {

 apiKey: "AIzaSyADGYsqhbCFuKj2fXpontLpND_rtT7Nlno",

 authDomain: "alorico-59754.firebaseapp.com",

 databaseURL:
 "https://alorico-59754-default-rtdb.firebaseio.com",

 projectId: "alorico-59754"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const pendientesDiv =
document.getElementById("contenedor-pendientes");

const cocinaDiv =
document.getElementById("contenedor-cocina");

const listosDiv =
document.getElementById("contenedor-listos");

const historialDiv =
document.getElementById("contenedor-historial");

const ventasHoy =
document.getElementById("ventas-hoy");

const cantidadPedidos =
document.getElementById("cantidad-pedidos");

const cantidadDelivery =
document.getElementById("cantidad-delivery");

window.abrirMaps = (url)=>{

 window.open(url,"_blank");

};

onValue(ref(db,"pedidos_cocina"),(snap)=>{

 const data = snap.val();

 pendientesDiv.innerHTML = "";
 cocinaDiv.innerHTML = "";
 listosDiv.innerHTML = "";
 historialDiv.innerHTML = "";

 let totalGeneral = 0;
 let totalPedidos = 0;
 let totalDeliverys = 0;
 let historialDeliveryHTML = "";

 if(!data)return;

 Object.entries(data).forEach(([pedidoId,pedido])=>{

  /* DIA OPERATIVO 4AM */

  const ahora = new Date();

  const fechaPedido =
  new Date(
   pedido.timestamp || Date.now()
  );

  function obtenerDiaOperativo(fecha){

   const f = new Date(fecha);

   if(f.getHours() < 4){

    f.setDate(
     f.getDate() - 1
    );

   }

   return f.toDateString();
  }

  const diaActual =
  obtenerDiaOperativo(ahora);

  const diaPedido =
  obtenerDiaOperativo(fechaPedido);

  if(diaPedido !== diaActual){
   return;
  }

  let estado =
  pedido.estado || "pendiente";

  let total =
  Number(pedido.total || 0);

  totalGeneral += total;

  if(
   estado !== "entregado" &&
   estado !== "cancelado"
  ){
   totalPedidos++;
  }

  if(pedido.tipoPedido === "delivery"){

   totalDeliverys++;

   historialDeliveryHTML += `

   <div class="
    mt-3
    bg-orange-500/10
    border border-orange-500/20
    rounded-2xl
    p-3
   ">

    <p class="
     font-bold
     text-orange-300
    ">
     ${pedido.nombre || "Cliente"}
    </p>

    <p class="text-white mt-1">
     Delivery:
     Gs. ${Number(
      pedido.deliveryCosto || 0
     ).toLocaleString()}
    </p>

   </div>

   `;
  }

  const card =
  document.createElement("div");

  card.className = "pedido-card";

  card.innerHTML = `

  <div class="
   flex justify-between
   items-start
   mb-4
  ">

   <div>

    <h3 class="
     text-2xl
     font-bold
    ">
     ${
      pedido.tipoPedido === "delivery"
      ? "DELIVERY"
      : "Mesa " + pedido.mesa
     }
    </h3>

   </div>

   <span class="
    px-4 py-1
    rounded-full
    font-bold
    text-sm
    estado-${estado}
   ">
    ${estado.toUpperCase()}
   </span>

  </div>

  <div class="
   bg-white/5
   rounded-2xl
   p-3
   border border-white/5
  ">

   <p class="
    text-cyan-300
    font-bold
   ">
    👤 ${pedido.nombre || "Sin Nombre"}
   </p>

   <p class="
    text-green-300
    mt-2
   ">
    📞 ${pedido.telefono || ""}
   </p>

   ${
    pedido.observacion
    ? `
    <div class="
     mt-3
     bg-yellow-500/10
     border border-yellow-500/20
     rounded-xl
     p-3
     text-yellow-200
    ">
     📝 ${pedido.observacion}
    </div>
    `
    : ""
   }

  </div>

  <div class="
   mt-4
   bg-black/20
   rounded-2xl
   p-3
   border border-white/5
  ">

   ${Object.values(
    pedido.items || {}
   ).map(p=>`

   <div class="
    flex justify-between
    py-2
    border-b
    border-white/5
   ">

    <p>
     ${p.cantidad}x ${p.nombre}
    </p>

    <p class="
     text-green-400
     font-bold
    ">
     Gs. ${Number(
      p.precio * p.cantidad
     ).toLocaleString()}
    </p>

   </div>

   `).join("")}

   ${
    pedido.tipoPedido === "delivery"
    ? `
    <div class="
     flex justify-between
     mt-4
     pt-4
     border-t
     border-orange-500/20
    ">

     <p class="
      text-orange-300
      font-semibold
     ">
      🚗 Delivery
     </p>

     <p class="
      text-orange-300
      font-bold
     ">
      Gs. ${Number(
       pedido.deliveryCosto || 0
      ).toLocaleString()}
     </p>

    </div>
    `
    : ""
   }

   <div class="
    flex justify-between
    mt-4
    pt-4
    border-t
    border-white/10
   ">

    <p class="
     text-xl
     font-bold
    ">
     TOTAL
    </p>

    <p class="
     text-2xl
     font-bold
     text-green-400
    ">
     Gs. ${Number(
      total
     ).toLocaleString()}
    </p>

   </div>

  </div>

  ${
   pedido.maps
   ? `
   <button
    onclick="abrirMaps('${pedido.maps}')"
    class="
     w-full
     mt-4
     bg-cyan-500
     py-3
     rounded-2xl
     font-bold
    ">

    📍 VER UBICACIÓN

   </button>
   `
   : ""
  }

  <div class="
   grid grid-cols-2
   gap-3
   mt-4
  ">

   <button
    class="btn bg-blue-500"
    id="cocina-${pedidoId}">
    Enviar a Cocina
   </button>

   <button
    class="btn bg-green-500"
    id="listo-${pedidoId}">
    Listo
   </button>

   <button
    class="btn bg-gray-500"
    id="entregado-${pedidoId}">
    Entregado
   </button>

   <button
    class="btn bg-red-500"
    id="cancelar-${pedidoId}">
    Cancelar
   </button>

  </div>

  `;

  if(estado === "pendiente"){
   pendientesDiv.appendChild(card);
  }

  if(estado === "preparando"){
   cocinaDiv.appendChild(card);
  }

  if(estado === "listo"){
   listosDiv.appendChild(card);
  }

  if(
   estado === "entregado" ||
   estado === "cancelado"
  ){
   historialDiv.appendChild(card);
  }

  setTimeout(()=>{

   const btnCocina =
   document.getElementById(
    `cocina-${pedidoId}`
   );

   const btnListo =
   document.getElementById(
    `listo-${pedidoId}`
   );

   const btnEntregado =
   document.getElementById(
    `entregado-${pedidoId}`
   );

   const btnCancelar =
   document.getElementById(
    `cancelar-${pedidoId}`
   );

   if(btnCocina){

    btnCocina.onclick = ()=>{

     update(
      ref(
       db,
       "pedidos_cocina/" + pedidoId
      ),
      {
       estado:"preparando"
      }
     );

    };

   }

   if(btnListo){

    btnListo.onclick = ()=>{

     update(
      ref(
       db,
       "pedidos_cocina/" + pedidoId
      ),
      {
       estado:"listo"
      }
     );

    };

   }

   if(btnEntregado){

    btnEntregado.onclick = ()=>{

     update(
      ref(
       db,
       "pedidos_cocina/" + pedidoId
      ),
      {
       estado:"entregado"
      }
     );

    };

   }

   if(btnCancelar){

    btnCancelar.onclick = ()=>{

     update(
      ref(
       db,
       "pedidos_cocina/" + pedidoId
      ),
      {
       estado:"cancelado"
      }
     );

    };

   }

  },100);

 });

 ventasHoy.innerText =
 "Gs. " +
 totalGeneral.toLocaleString();

 cantidadPedidos.innerText =
 totalPedidos;

 cantidadDelivery.innerText =
 totalDeliverys;

 const historialBox =
 document.getElementById(
  "historial-delivery"
 );

 if(historialBox){

  historialBox.innerHTML =
  historialDeliveryHTML;

 }

});

</script>

</body>
</html>
