<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alo Rico - Panel Operador</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 font-family:'Poppins',sans-serif;
 background:#0f172a;
 color:white;
 overflow-x:hidden;
}

body::before{
 content:"";
 position:fixed;
 inset:0;

 background:
 linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.90)),
 url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1600&auto=format&fit=crop');

 background-size:cover;
 background-position:center;

 z-index:-2;
}

body::after{
 content:"";
 position:fixed;
 inset:0;
 backdrop-filter:blur(8px);
 z-index:-1;
}

/* CARDS */

.card{
 background:rgba(255,255,255,.06);
 border:1px solid rgba(255,255,255,.08);
 backdrop-filter:blur(12px);
 border-radius:28px;
 box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.pedido-card{
 background:#1e293b;
 border-radius:24px;
 padding:22px;
 border:1px solid rgba(255,255,255,.08);
 box-shadow:0 10px 30px rgba(0,0,0,.35);
 transition:.25s;
 animation:fadeIn .3s ease;
}

.pedido-card:hover{
 transform:translateY(-4px);
}

@keyframes fadeIn{

 from{
  opacity:0;
  transform:translateY(20px);
 }

 to{
  opacity:1;
  transform:translateY(0);
 }

}

/* BOTONES */

.btn{
 border:none;
 border-radius:18px;
 padding:14px;
 font-weight:700;
 cursor:pointer;
 transition:.25s;
 color:white;
}

.btn:hover{
 transform:scale(1.03);
}

/* SCROLL */

.scroll-area{
 max-height:78vh;
 overflow:auto;
 padding-right:4px;
}

.scroll-area::-webkit-scrollbar{
 width:6px;
}

.scroll-area::-webkit-scrollbar-thumb{
 background:#475569;
 border-radius:20px;
}

/* RESPONSIVE */

@media(max-width:900px){

 .scroll-area{
  max-height:none;
 }

}

</style>

</head>

<body>

<div class="p-6">

<!-- HEADER -->

<div class="flex flex-col xl:flex-row justify-between gap-5 mb-8">

 <div>

  <h1 class="text-5xl font-bold text-yellow-400">
   Alo Rico Panel
  </h1>

  <p class="text-gray-300 mt-2 text-lg">
   Operador • Cocina • Delivery
  </p>

 </div>

 <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

  <div class="card p-5 min-w-[170px]">

   <p class="text-gray-400 text-sm">
    Ventas Hoy
   </p>

   <h2
    id="ventas-hoy"
    class="text-2xl font-bold text-green-400 mt-2">
    Gs. 0
   </h2>

  </div>

  <div class="card p-5 min-w-[170px]">

   <p class="text-gray-400 text-sm">
    Pedidos Activos
   </p>

   <h2
    id="cantidad-pedidos"
    class="text-2xl font-bold text-blue-400 mt-2">
    0
   </h2>

  </div>

  <div class="card p-5 min-w-[170px]">

   <p class="text-gray-400 text-sm">
    Deliverys
   </p>

   <h2
    id="cantidad-delivery"
    class="text-2xl font-bold text-orange-400 mt-2">
    0
   </h2>

  </div>

  <div class="card p-5 min-w-[170px]">

   <p class="text-gray-400 text-sm">
    Estado
   </p>

   <h2 class="text-xl font-bold text-pink-400 mt-2">
    En Vivo
   </h2>

  </div>

 </div>

</div>

<!-- COLUMNAS -->

<div class="grid grid-cols-1 xl:grid-cols-3 gap-6">

 <!-- OPERADOR -->

 <div class="card p-5">

  <h2 class="text-3xl font-bold text-yellow-400 mb-5">
   Pedidos Pendientes
  </h2>

  <div
   id="contenedor-pedidos"
   class="scroll-area space-y-5">
  </div>

 </div>

 <!-- COCINA -->

 <div class="card p-5">

  <h2 class="text-3xl font-bold text-blue-400 mb-5">
   Cocina
  </h2>

  <div
   id="contenedor-cocina"
   class="scroll-area space-y-5">
  </div>

 </div>

 <!-- DELIVERY -->

 <div class="card p-5">

  <h2 class="text-3xl font-bold text-green-400 mb-5">
   Delivery
  </h2>

  <div
   id="contenedor-delivery"
   class="scroll-area space-y-5">
  </div>

 </div>

</div>

</div>

<!-- SONIDO -->

<audio
 id="nuevo-pedido"
 src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">
</audio>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
 getDatabase,
 ref,
 onValue,
 remove
}
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

 apiKey: "AIzaSyADGYsqhbCFuKj2fXpontLpND_rtT7Nlno",

 authDomain: "alorico-59754.firebaseapp.com",

 databaseURL:
 "https://alorico-59754-default-rtdb.firebaseio.com",

 projectId: "alorico-59754",

 storageBucket:
 "alorico-59754.firebasestorage.app",

 messagingSenderId: "120993494626",

 appId:
 "1:120993494626:web:9f9cb0ad6fbfbd1abd033b"
};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

/* ELEMENTOS */

const contenedorPedidos =
document.getElementById("contenedor-pedidos");

const contenedorCocina =
document.getElementById("contenedor-cocina");

const contenedorDelivery =
document.getElementById("contenedor-delivery");

const ventasHoy =
document.getElementById("ventas-hoy");

const cantidadPedidos =
document.getElementById("cantidad-pedidos");

const cantidadDelivery =
document.getElementById("cantidad-delivery");

const audio =
document.getElementById("nuevo-pedido");

/* CONTROL SONIDO */

let totalAnterior = 0;

/* LEER PEDIDOS */

onValue(ref(db,"pedidos"),(snap)=>{

 const data = snap.val();

 contenedorPedidos.innerHTML = "";
 contenedorCocina.innerHTML = "";
 contenedorDelivery.innerHTML = "";

 let totalGeneral = 0;
 let totalPedidos = 0;
 let totalDeliverys = 0;

 if(!data){

  ventasHoy.innerText = "Gs. 0";
  cantidadPedidos.innerText = "0";
  cantidadDelivery.innerText = "0";

  return;
 }

 const mesas =
 Object.entries(data);

 /* SONIDO */

 if(mesas.length > totalAnterior){

  audio.play();

  totalAnterior = mesas.length;
 }

 mesas.forEach(([mesa,pedidos])=>{

  let total = 0;

  let itemsHTML = "";

  Object.values(pedidos).forEach(p=>{

   total += p.precio * p.cantidad;

   itemsHTML += `
    <p>
     ${p.cantidad}x ${p.nombre}
    </p>
   `;
  });

  totalGeneral += total;

  totalPedidos++;

  if(mesa.includes("delivery")){

   totalDeliverys++;
  }

  const card =
  document.createElement("div");

  card.className =
  "pedido-card";

  card.innerHTML = `

   <div class="
    flex justify-between items-center mb-4
   ">

    <h3 class="
     text-2xl font-bold
    ">
     ${mesa.replace("mesa_","Mesa ")}
    </h3>

    <span class="
     bg-yellow-500
     px-4 py-1
     rounded-full
     font-bold
     text-sm
    ">
     Pendiente
    </span>

   </div>

   <div class="
    space-y-2
    text-lg
    text-gray-200
   ">
    ${itemsHTML}
   </div>

   <div class="
    flex justify-between
    items-center
    mt-5 mb-5
   ">

    <span class="
     text-green-400
     font-bold
     text-2xl
    ">
     Gs. ${total.toLocaleString()}
    </span>

    <span class="
     text-gray-400
     text-sm
    ">
     En vivo
    </span>

   </div>

   <div class="
    grid grid-cols-2 gap-3
   ">

    <button
     class="btn bg-blue-500"
     id="cocina-${mesa}">
     Cocina
    </button>

    <button
     class="btn bg-green-500"
     id="listo-${mesa}">
     Listo
    </button>

    <button
     class="btn bg-orange-500">
     WhatsApp
    </button>

    <button
     class="btn bg-red-500"
     id="cancelar-${mesa}">
     Cancelar
    </button>

   </div>

  `;

  contenedorPedidos.appendChild(card);

  /* BOTON COCINA */

  setTimeout(()=>{

   const btnCocina =
   document.getElementById(`cocina-${mesa}`);

   if(btnCocina){

    btnCocina.onclick = ()=>{

     contenedorCocina.appendChild(card);

    };

   }

   /* BOTON LISTO */

   const btnListo =
   document.getElementById(`listo-${mesa}`);

   if(btnListo){

    btnListo.onclick = ()=>{

     card.remove();

    };

   }

   /* BOTON CANCELAR */

   const btnCancelar =
   document.getElementById(`cancelar-${mesa}`);

   if(btnCancelar){

    btnCancelar.onclick = ()=>{

     if(confirm("Cancelar pedido?")){

      remove(ref(db,"pedidos/" + mesa));

     }

    };

   }

  },100);

 });

 ventasHoy.innerText =
 "Gs. " + totalGeneral.toLocaleString();

 cantidadPedidos.innerText =
 totalPedidos;

 cantidadDelivery.innerText =
 totalDeliverys;

});

</script>

</body>
</html>
